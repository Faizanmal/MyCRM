name: Enterprise Security Pipeline

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  security-gates:
    name: Security Guardrails & Compliance Gates
    runs-on: ubuntu-latest
    env:
      DATABASE_ENGINE: django.db.backends.sqlite3
      SECRET_KEY: test-ci-secret-key-0000000000000000000000000000000000000000
      DEBUG: 'False'
      USE_SQLITE: 'True'

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-django pytest-asyncio

      - name: Run Database Migrations
        run: |
          cd backend
          python manage.py migrate

      - name: Run Enterprise Security Pipeline
        run: |
          python scripts/run_security_pipeline.py --mode all --report docs/security/security-pipeline-report.json

      - name: Upload Security Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-pipeline-report
          path: docs/security/security-pipeline-report.json
          if-no-files-found: warn
